# config/default.yaml
# Run configuration for VEKTOR.

strategy: weinstein          # default strategy; override with --strategy

# Params are namespaced PER STRATEGY. Only the block matching the selected
# strategy is read, so switching strategies (e.g. --strategy sma_cross) needs
# no other edits. Omit a strategy's block entirely to use its declared defaults.
strategy_params:

#  weinstein:
#    base_length: long        # short | medium | long | custom
#                                # NOTE: when base_length != custom, the preset table in
#                                # weinstein_setup.py overrides lookback_weeks, min_base_weeks
#                                # and min_sup_touches below (medium preset: 30, 14, 2) --
#                                # they only take effect if you set base_length: custom.
#    sma_weeks: 30
#    lookback_weeks: 36         # only used when base_length: custom (medium preset uses 30)
#    min_base_weeks: 10         # only used when base_length: custom (medium preset uses 14)
#    min_touches: 2             # resistance touches -- always active, no preset override
#    min_sup_touches: 2         # only used when base_length: custom (medium preset also uses 2)
#    touch_tolerance: 0.01     # fraction, 0.015 == 1.5%
#    max_base_breach_frac: 0.10
#    max_range_vs_decline: 1.2
#    max_dist_to_breakout: 30.0
#    min_prior_decline: 0.15
#    max_ma_decline_pct: 8.0
#    max_ma_rise_pct: 1.5
#    require_volume: false
#    require_rs_positive: false
#    rs_period: 52

  # "Follow the money": Stage-2 leaders with positive RS that are NOT yet
  # overextended above their 30W MA. Complement to weinstein (that one finds
  # bases about to start Stage 2; this finds Stage-2 trends still worth
  # following). Defaults below are strategies/momentum_leaders.py's own
  # ParamSpec defaults, not tuned against your chart examples the way
  # weinstein's were -- treat these as a starting point.
  momentum_leaders:
    sma_weeks: 30
    slope_lookback: 5          # bars used to measure MA slope (must be rising)
    max_dist_above_ma: 20.0    # max %% close may sit ABOVE the MA (anti-overextension cap)
    min_dist_above_ma: 0.0     # min %% above the MA (0 = just needs to be above it)
    min_rs: 0.0                # min Mansfield RS (0 = merely outperforming; raise to be stricter)
    rs_period: 52

  sma_cross:
    sma_weeks: 30
    slope_lookback: 4

# The scan TARGET. (The key is still `market:` -- the web UI calls this section
# the Target, but renaming the key would break every existing config and
# daily_report.py. See the naming note at the top of src/config.py.)
market:
  mode: us

  # US universe. One of:
  #   index       union of the `indices:` lists below
  #   quality     iShares MSCI USA Quality Factor ETF holdings (~125 names,
  #               from the issuer's own daily file; see src/holdings.py)
  #   sectors     one named sector (`group:`) or the top-N by perf_col
  #   industries  one named industry (`group:`) or the top-N by perf_col
  #               (top_n_industries: 0 scans the whole market)
  #   rotation    sectors currently in the rotation_quadrants below
  #   ticker      an explicit `tickers:` list, diagnostic mode
  #
  # `source: sp500` still works and is translated to index + [sp500], with a
  # note in the log.
  source: rotation

  # Constituent lists to union when source: index. Keys come from
  # src/indices.py::INDICES -- sp500, nasdaq100, dow30, sp600. Overlap is
  # deduplicated, so listing several costs nothing.
  indices: ["sp500"]

  # One named Finviz group when source is sectors/industries. Empty means rank
  # them by perf_col instead. NOT validated against a list: Finviz owns that
  # vocabulary. An unknown name returns nothing and says so.
  group: ""

  rotation_quadrants: ["leading", "improving"]
  top_n_industries: 10       # 0 = scan FULL market; >0 = only top-N groups.
  perf_col: Perf Quart        # "Perf Week" or "Perf Quart"

  # International universe. One of:
  #   indices     Wikipedia constituents of the intl_codes below
  #   quality     iShares Edge MSCI Europe Quality Factor UCITS ETF holdings.
  #               Pan-European by construction, so intl_codes is NOT consulted
  #               for the universe -- only for which benchmark the regime gate
  #               uses.
  intl_source: indices
  intl_codes: []             # e.g. [DE, GB, FR, IT, ES]; empty == all non-US

# History handed to the STRATEGY. Not the chart window: charts always show the
# last 2 years (run.py::CHART_YEARS), trimmed for display after the signals are
# computed on everything below. Widening this changes the analysis -- the 30W MA
# warm-up, the prior-decline lookback and weinstein_setup's 156-week cluster
# window all read it -- and changes nothing about what you see.
#
# `chart_start` and `make_charts` were REMOVED; setting either is now an error
# rather than a silent no-op. See the header of src/config.py.
data_start: "2020-01-01"
output_dir: results
strict: false
cache_max_age_hours: 12
