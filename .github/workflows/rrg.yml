# Weekly sector Relative Rotation Graph -> Telegram. No local machine involved.
#
# ---------------------------------------------------------------------------
# IF THIS JOB FAILS, READ THE "Preflight" STEP FIRST
# ---------------------------------------------------------------------------
# `exit code 1` on its own is consistent with at least four causes: missing
# secrets, missing dependencies, Yahoo refusing the runner, or an empty data
# cache. scripts/preflight.py distinguishes them and prints a verdict. It is
# continue-on-error, so its output is always visible even when the run dies.
#
# ---------------------------------------------------------------------------
# TWO SILENT-FAILURE MODES THIS FILE DEFENDS AGAINST
# ---------------------------------------------------------------------------
# 1. GitHub DISABLES scheduled workflows after 60 days with no repository
#    activity, notifying only the repo owner by email. A weekly job in a repo
#    you are not actively committing to WILL eventually stop, quietly. The
#    "Persist data cache" step commits every run, which counts as activity.
#
# 2. Yahoo Finance rate-limits and sometimes blocks cloud-provider IPs, which
#    is exactly what GitHub-hosted runners are. Defences, in order:
#      a. curl_cffi, which recent yfinance uses for browser TLS impersonation;
#      b. make_rrg.py retries with backoff;
#      c. the committed data/ cache, which make_rrg.py's ResilientLoader falls
#         back to when a download fails outright -- so a hard block yields a
#         chart on last week's closes instead of no chart.
#    (c) only works if the cache EXISTS. On a first run it does not, so seed
#    it once from your laptop:
#        python scripts/make_rrg.py
#        git add -f data/SPY.csv data/XL*.csv
#        git commit -m "seed RRG data cache" && git push
#
# Scheduled runs are best-effort: GitHub delays cron under load, sometimes by
# 30+ minutes. Never read the delivery time as exact.
# ---------------------------------------------------------------------------

name: Sector RRG

on:
  schedule:
    # Saturday 06:00 UTC = 08:00 in Madrid during CEST (late Mar - late Oct).
    # GitHub cron is UTC-only with no DST handling, so from late October this
    # arrives at 07:00 local. Use "0 7 * * 6" for the winter half if it matters.
    # Markets are shut on Saturday, so the W-FRI weekly bar is already final.
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write             # needed to commit the refreshed data cache

concurrency:
  group: rrg
  cancel-in-progress: false

jobs:
  rrg:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 are the Node-24 majors. If a tag ever fails to resolve, the
      # older v4/v5 still work -- the Node 20 notice is a warning, not an error.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "curl_cffi>=0.7" || echo "curl_cffi unavailable, continuing"

      - name: Preflight (diagnoses any failure below)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/preflight.py

      - name: Generate RRG and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p docs
          python scripts/make_rrg.py \
            --out docs/rrg.png \
            --json docs/rrg.json \
            --telegram

      # data/ is normally gitignored, so -f is required or this silently
      # commits nothing. Only the 12 RRG symbols are added, never the full
      # scanner cache, which can run to well over a thousand files.
      - name: Persist data cache
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/SPY.csv data/XL*.csv 2>/dev/null || true
          git add -f docs/rrg.png docs/rrg.json 2>/dev/null || true
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore(rrg): weekly run $(date -u +%F) [skip ci]"
          else
            git commit -m "chore(rrg): refresh data cache and chart $(date -u +%F) [skip ci]"
          fi
          git push

      - name: Upload chart as an artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rrg-${{ github.run_number }}
          path: |
            docs/rrg.png
            docs/rrg.json
          retention-days: 90
          if-no-files-found: ignore   # nothing to upload is already reported above

      # Without this a failed run is only an email you will learn to ignore.
      # curl, not python, so it still fires when the python step died early.
      - name: Alert Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets absent, cannot alert. That is very likely the cause."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=VEKTOR RRG job FAILED. See the Preflight step: ${RUN_URL}" \
            || echo "Could not send the failure alert."